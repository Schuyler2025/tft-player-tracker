version: '3.8'

services:
  app:
    build: .
    container_name: tft-tracker
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./tft_tracker.db:/app/tft_tracker.db
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: tft-tracker-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:
